<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detetive de Links - Maratona Tech</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1d4ed8;
            --bg-global: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #e2e8f0;
            
            --safe-bg: #f0fdf4;
            --safe-text: #166534;
            --safe-border: #22c55e;
            
            --danger-bg: #fef2f2;
            --danger-text: #991b1b;
            --danger-border: #ef4444;

            --warning-bg: #fffbeb;
            --warning-text: #92400e;
            --warning-border: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .acessibilidade {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            width: 100%;
            max-width: 750px;
        }

        .btn-acessivel {
            background-color: #e2e8f0;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-acessivel:hover {
            background-color: #cbd5e1;
        }

        .btn-som {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .btn-som:hover {
            background-color: #bbf7d0;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            font-size: 20px;
            transition: font-size 0.2s ease;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.8em;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9em;
            line-height: 1.5;
        }

        .area-busca {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .area-busca label {
            font-size: 0.85em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .input-container {
            position: relative;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 20px;
            font-size: 0.9em;
            color: var(--text-main);
            background-color: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.15);
        }

        .btn-verificar {
            background-color: var(--primary);
            color: #ffffff;
            padding: 18px;
            font-size: 1em;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(30, 64, 175, 0.2);
        }

        .btn-verificar:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .resultado {
            margin-top: 32px;
            padding: 24px;
            border-radius: 12px;
            border-left: 6px solid;
            transition: all 0.3s ease;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .oculta {
            display: none !important;
        }

        .carregando {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border-color: var(--warning-border);
            font-weight: 600;
            text-align: center;
        }

        .seguro {
            background-color: var(--safe-bg);
            color: var(--safe-text);
            border-color: var(--safe-border);
        }

        .perigoso {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border-color: var(--danger-border);
        }

        .resultado-titulo {
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .resultado-corpo {
            font-weight: 400;
            color: #334155;
        }

        .btn-abrir-externo {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 16px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: 600;
        }

        /* Estilo do Visualizador do Site */
        .janela-site {
            margin-top: 24px;
            width: 100%;
            height: 450px;
            border: 2px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background-color: #fff;
            display: flex;
            flex-direction: column;
        }

        .janela-header {
            background-color: #cbd5e1;
            padding: 8px 16px;
            font-size: 0.75em;
            color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .janela-site iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="acessibilidade">
        <button type="button" class="btn-acessivel" onclick="mudarFonte(2)">A+ Ampliar Texto</button>
        <button type="button" class="btn-acessivel" onclick="mudarFonte(-2)">A- Reduzir Texto</button>
        <button type="button" class="btn-acessivel btn-som" onclick="lerTexto()">🔊 Ouvir Instruções</button>
    </div>

    <main class="container" id="container-principal">
        <header>
            <h1>Detetive de Links</h1>
            <p id="texto-instrucao">Cole qualquer link abaixo (site, e-mail, telefone, whatsapp) para analisar e acessar.</p>
        </header>

        <form class="area-busca" onsubmit="event.preventDefault(); verificarLink();">
            <label for="input-link">Insira o Link ou Endereço:</label>
            <div class="input-container">
                <input type="text" id="input-link" placeholder="Ex: google.com, mailto:teste@email.com, tel:11999999999" autocomplete="off">
            </div>
            <button type="submit" class="btn-verificar">ANALISAR E ACESSAR LINK</button>
        </form>

        <div id="resultado" class="resultado oculta"></div>

        <div id="visualizador-container" class="janela-site oculta">
            <div class="janela-header">
                <span>🌐 Pré-visualização do Endereço</span>
                <small>Caso o site bloqueie a tela, use o botão de acesso externo acima</small>
            </div>
            <iframe id="janela-iframe"></iframe>
        </div>
    </main>

    <script>
        let tamanhoFonteAtual = 20;

        function mudarFonte(variacao) {
            tamanhoFonteAtual += variacao;
            if (tamanhoFonteAtual < 14) tamanhoFonteAtual = 14;
            if (tamanhoFonteAtual > 32) tamanhoFonteAtual = 32;
            
            const container = document.getElementById("container-principal");
            if (container) {
                container.style.fontSize = tamanhoFonteAtual + "px";
            }
        }

        function lerTexto() {
            const texto = "Bem-vindo ao Detetive de Links. Cole qualquer link no campo indicado para testar e abrir.";
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const fala = new SpeechSynthesisUtterance(texto);
                fala.lang = 'pt-BR';
                fala.rate = 0.95; 
                window.speechSynthesis.speak(fala);
            }
        }

        function falarResultado(mensagem) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const fala = new SpeechSynthesisUtterance(mensagem);
                fala.lang = 'pt-BR';
                fala.rate = 0.95;
                window.speechSynthesis.speak(fala);
            }
        }

        function verificarLink() {
            const inputElement = document.getElementById("input-link");
            const divResultado = document.getElementById("resultado");
            const visualizadorContainer = document.getElementById("visualizador-container");
            const iframe = document.getElementById("janela-iframe");

            if (!inputElement || !divResultado || !visualizadorContainer || !iframe) return;

            let entrada = inputElement.value.trim();

            if (entrada === "") {
                alert("Por favor, insira um link válido para análise.");
                return;
            }

            divResultado.className = "resultado carregando";
            divResultado.innerHTML = "⏳ Identificando tipo de protocolo e preparando o acesso...";
            visualizadorContainer.classList.add("oculta");

            setTimeout(() => {
                divResultado.className = "resultado";
                let linkFinal = entrada;
                let tipoLink = "site"; // 'site', 'email', 'telefone', 'app'

                // 1. Identifica se é E-mail (mailto:)
                if (entrada.startsWith("mailto:") || entrada.includes("@") && !entrada.includes("/")) {
                    tipoLink = "email";
                    linkFinal = entrada.startsWith("mailto:") ? entrada : "mailto:" + entrada;
                }
                // 2. Identifica se é Telefone (tel:)
                else if (entrada.startsWith("tel:") || (/^[0-9+\s()-]+$/.test(entrada) && entrada.length >= 8)) {
                    tipoLink = "telefone";
                    linkFinal = entrada.startsWith("tel:") ? entrada : "tel:" + entrada.replace(/\s+/g, '');
                }
                // 3. Identifica se é aplicativo (whatsapp, telegram, etc.)
                else if (entrada.startsWith("whatsapp://") || entrada.startsWith("tg://") || entrada.startsWith("intent://")) {
                    tipoLink = "app";
                }
                // 4. Se for site Web normal
                else {
                    if (!/^https?:\/\//i.test(entrada)) {
                        linkFinal = "https://" + entrada; // Tenta HTTPS primeiro por padrão
                    }
                }

                // Diagnóstico para links de Email, Telefone ou Apps
                if (tipoLink !== "site") {
                    divResultado.classList.add("seguro");
                    divResultado.innerHTML = `
                        <div class="resultado-titulo">📱 Link de Ação/Aplicativo Detectado</div>
                        <div class="resultado-corpo">
                            Este é um link do tipo <strong>${tipoLink.toUpperCase()}</strong>. Ele não é uma página web convencional, por isso não é exibido dentro do quadrado.
                            <br><br>
                            <a href="${linkFinal}" class="btn-abrir-externo" target="_blank">Clique aqui para executar ação (${linkFinal})</a>
                        </div>
                    `;
                    falarResultado("Link de ação ou aplicativo detectado. Use o botão na tela para executar.");
                    return;
                }

                // Diagnóstico para Sites Web
                const linkMinusc = linkFinal.toLowerCase();
                const gatilhosPhishing = ["promocao", "premio", "gratis", "urgente", "banco", "atualize", "cpf", "desconto", "ganhe", "sorteio", "vaga", "pix"];
                let motivo = "";
                let suspeito = false;

                if (linkMinusc.startsWith("http://")) {
                    suspeito = true;
                    motivo = "O site usa conexão não criptografada (HTTP antigo).";
                } else {
                    for (let termo of gatilhosPhishing) {
                        if (linkMinusc.includes(termo)) {
                            suspeito = true;
                            motivo = `Contém palavra-chave suspeita: "${termo}".`;
                            break;
                        }
                    }
                }

                if (suspeito) {
                    divResultado.classList.add("perigoso");
                    divResultado.innerHTML = `
                        <div class="resultado-titulo">🚨 Atenção no Acesso</div>
                        <div class="resultado-corpo">
                            <strong>Diagnóstico:</strong> ${motivo}
                            <br>
                            <a href="${linkFinal}" class="btn-abrir-externo" target="_blank" rel="noopener noreferrer">Abrir site em nova aba de segurança ↗</a>
                        </div>
                    `;
                } else {
                    divResultado.classList.add("seguro");
                    divResultado.innerHTML = `
                        <div class="resultado-titulo">✅ Link Web Verificado</div>
                        <div class="resultado-corpo">
                            Endereço formatado com sucesso! Tentando renderizar a página abaixo...
                            <br>
                            <a href="${linkFinal}" class="btn-abrir-externo" target="_blank" rel="noopener noreferrer">Abrir em nova aba ↗</a>
                        </div>
                    `;
                }

                // Carrega no iframe
                iframe.src = linkFinal;
                visualizadorContainer.classList.remove("oculta");

            }, 800);
        }
    </script>
</body>
</html>
