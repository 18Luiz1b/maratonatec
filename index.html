<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Links Seguros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Acessibilidade: Controle de Fonte e Áudio -->
    <div class="acessibilidade">
        <button id="btn-aumentar" class="btn-acessivel" onclick="mudarFonte(2)">A+ (Letra Maior)</button>
        <button id="btn-diminuir" class="btn-acessivel" onclick="mudarFonte(-2)">A- (Letra Menor)</button>
        <button id="btn-audio" class="btn-acessivel btn-som" onclick="lerTexto()">Ouvir Explicação</button>
    </div>

    <main class="container">
        <header>
            <h1>Detetive de Links</h1>
            <p id="texto-instrucao">Cole abaixo o link (endereço do site) que você recebeu para saber se ele é <strong>SEGURO</strong> ou um <strong>GOLPE</strong>.</p>
        </header>

        <section class="area-busca">
            <label for="input-link">Cole o link aqui:</label>
            <input type="text" id="input-link" placeholder="Ex: https://site-estranho.com/promocao">
            
            <button class="btn-verificar" onclick="verificarLink()">VERIFICAR LINK AGORA</button>
        </section>

        <!-- Resultado que vai aparecer na tela -->
        <div id="resultado" class="resultado oculta"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
