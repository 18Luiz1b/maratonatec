<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detetive de Links - Maratona Tech</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1d4ed8;
            --bg-global: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #e2e8f0;
            
            --safe-bg: #f0fdf4;
            --safe-text: #166534;
            --safe-border: #22c55e;
            
            --danger-bg: #fef2f2;
            --danger-text: #991b1b;
            --danger-border: #ef4444;

            --warning-bg: #fffbeb;
            --warning-text: #92400e;
            --warning-border: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .acessibilidade {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            width: 100%;
            max-width: 750px;
        }

        .btn-acessivel {
            background-color: #e2e8f0;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-acessivel:hover {
            background-color: #cbd5e1;
        }

        .btn-som {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .btn-som:hover {
            background-color: #bbf7d0;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            font-size: 20px;
            transition: font-size 0.2s ease;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.8em;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9em;
            line-height: 1.5;
        }

        .area-busca {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .area-busca label {
            font-size: 0.85em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .input-container {
            position: relative;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 20px;
            font-size: 0.9em;
            color: var(--text-main);
            background-color: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.15);
        }

        .btn-verificar {
            background-color: var(--primary);
            color: #ffffff;
            padding: 18px;
            font-size: 1em;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(30, 64, 175, 0.2);
        }

        .btn-verificar:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .resultado {
            margin-top: 32px;
            padding: 24px;
            border-radius: 12px;
            border-left: 6px solid;
            transition: all 0.3s ease;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .oculta {
            display: none !important;
        }

        .carregando {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border-color: var(--warning-border);
            font-weight: 600;
            text-align: center;
        }

        .seguro {
            background-color: var(--safe-bg);
            color: var(--safe-text);
            border-color: var(--safe-border);
        }

        .perigoso {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border-color: var(--danger-border);
        }

        .resultado-titulo {
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .resultado-corpo {
            font-weight: 400;
            color: #334155;
        }

        .box-descricao {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.9em;
        }

        .btn-opcao-entrada {
            display: inline-block;
            margin-top: 16px;
            padding: 14px 24px;
            background-color: #059669;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 700;
            text-align: center;
            transition: background 0.2s;
            box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2);
        }

        .btn-opcao-entrada:hover {
            background-color: #047857;
        }
        
        .btn-opcao-entrada.perigo {
            background-color: #dc2626;
        }
        .btn-opcao-entrada.perigo:hover {
            background-color: #b91c1c;
        }
    </style>
</head>
<body>

    <div class="acessibilidade">
        <button type="button" class="btn-acessivel" onclick="mudarFonte(2)">A+ Ampliar Texto</button>
        <button type="button" class="btn-acessivel" onclick="mudarFonte(-2)">A- Reduzir Texto</button>
        <button type="button" class="btn-acessivel btn-som" onclick="lerTexto()">🔊 Ouvir Instruções</button>
    </div>

    <main class="container" id="container-principal">
        <header>
            <h1>Detetive de Links</h1>
            <p id="texto-instrucao">Insira qualquer link. Nós entraremos nele para checar o conteúdo e trazer um resumo para você.</p>
        </header>

        <form class="area-busca" onsubmit="event.preventDefault(); analisarEEntrar();">
            <label for="input-link">Insira o Link ou Endereço:</label>
            <div class="input-container">
                <input type="text" id="input-link" placeholder="Ex: wikipedia.org, mailto:suporte@banco.com, tel:11999999999" autocomplete="off">
            </div>
            <button type="submit" class="btn-verificar">ACESSAR E DESCREVER LINK</button>
        </form>

        <div id="resultado" class="resultado oculta"></div>
    </main>

    <script>
        let tamanhoFonteAtual = 20;

        function mudarFonte(variacao) {
            tamanhoFonteAtual += variacao;
            if (tamanhoFonteAtual < 14) tamanhoFonteAtual = 14;
            if (tamanhoFonteAtual > 32) tamanhoFonteAtual = 32;
            const container = document.getElementById("container-principal");
            if (container) container.style.fontSize = tamanhoFonteAtual + "px";
        }

        function lerTexto() {
            const texto = "Cole qualquer link no campo indicado. O detetive vai acessar as informações de dentro dele e te dar uma opção segura de entrada.";
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const fala = new SpeechSynthesisUtterance(texto);
                fala.lang = 'pt-BR';
                window.speechSynthesis.speak(fala);
            }
        }

        function falarResultado(mensagem) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const fala = new SpeechSynthesisUtterance(mensagem);
                fala.lang = 'pt-BR';
                window.speechSynthesis.speak(fala);
            }
        }

        async function analisarEEntrar() {
            const inputElement = document.getElementById("input-link");
            const divResultado = document.getElementById("resultado");

            if (!inputElement || !divResultado) return;

            let entrada = inputElement.value.trim();
            if (entrada === "") {
                alert("Por favor, insira um endereço para ser analisado.");
                return;
            }

            divResultado.className = "resultado carregando";
            divResultado.innerHTML = "⏳ Entrando no link em modo seguro, lendo o código da página e preparando descrição...";
            divResultado.classList.remove("oculta");

            // Formatação do link
            let linkFinal = entrada;
            let tipoLink = "site";

            if (entrada.startsWith("mailto:") || (entrada.includes("@") && !entrada.includes("/"))) {
                tipoLink = "email";
                linkFinal = entrada.startsWith("mailto:") ? entrada : "mailto:" + entrada;
            } else if (entrada.startsWith("tel:") || (/^[0-9+\s()-]+$/.test(entrada) && entrada.length >= 8)) {
                tipoLink = "telefone";
                linkFinal = entrada.startsWith("tel:") ? entrada : "tel:" + entrada.replace(/\s+/g, '');
            } else if (entrada.startsWith("whatsapp://") || entrada.startsWith("tg://")) {
                tipoLink = "app";
            } else {
                if (!/^https?:\/\//i.test(entrada)) {
                    linkFinal = "https://" + entrada;
                }
            }

            // Se for link de App/Email/Telefone, resolve rápido sem raspar dados web
            if (tipoLink !== "site") {
                setTimeout(() => {
                    divResultado.className = "resultado seguro";
                    divResultado.innerHTML = `
                        <div class="resultado-titulo">📱 Link de Ação Direta Detectado</div>
                        <div class="resultado-corpo">
                            <strong>O que há dentro:</strong> Trata-se de um comando do sistema para abrir um aplicativo de ${tipoLink === 'email' ? 'E-mail' : tipoLink === 'telefone' ? 'Chamada de Voz' : 'Mensagens'}. Ele não possui uma página visual interna.
                        </div>
                        <a href="${linkFinal}" class="btn-opcao-entrada" target="_blank">OPÇÃO DE ENTRADA: EXECUTAR AÇÃO ↗</a>
                    `;
                    falarResultado("Link de ação direta detectado. Opção de entrada disponível.");
                }, 800);
                return;
            }

            // Se for SITE WEB, o JavaScript vai TENTAR acessar o código de dentro do link via Proxy Público
            let descricaoDoSite = "Não foi possível extrair dados textuais internos (Site protegido contra robôs ou offline).";
            let tituloSite = "Página Web Externa";
            
            try {
                // Allorigins é um proxy gratuito para permitir que o JavaScript leia códigos de outros sites em tempo real
                const resposta = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(linkFinal)}`);
                if (resposta.ok) {
                    const dados = await json = await resposta.json();
                    const htmlDoSite = dados.contents;

                    if (htmlDoSite) {
                        // Tenta achar a tag <title> dentro do site
                        const matchTitulo = htmlDoSite.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
                        if (matchTitulo && matchTitulo[1]) {
                            tituloSite = matchTitulo[1].trim();
                        }

                        // Procura por alguma tag de parágrafo <p> ou meta description para descrever
                        const matchDesc = htmlDoSite.match(/<meta[^>]*name=["']description["'][^>]*content=["']([^"']*)["']/i) || htmlDoSite.match(/<p[^>]*>([\s\S]*?)<\/p>/i);
                        if (matchDesc && matchDesc[1]) {
                            descricaoDoSite = matchDesc[1].replace(/<[^>]*>/g, '').substring(0, 180).trim() + "...";
                        } else {
                            descricaoDoSite = "O site foi acessado com sucesso, possui estrutura HTML válida, mas o conteúdo principal está em formato de imagens ou scripts.";
                        }
                    }
                }
            } catch (erro) {
                // Caso falhe ou dê timeout, deduz com base nas palavras chaves do link
                descricaoDoSite = "Acesso seguro estabelecido. O site recusou a leitura automatizada de robôs, mas sua estrutura de endereço está ativa.";
            }

            // Análise de risco/Phishing tradicional
            const linkMinusc = linkFinal.toLowerCase();
            const gatilhosPhishing = ["promocao", "premio", "gratis", "urgente", "banco", "atualize", "cpf", "desconto", "ganhe", "sorteio", "pix", "login", "cadastre"];
            let motivo = "";
            let suspeito = false;

            if (linkMinusc.startsWith("http://")) {
                suspeito = true;
                motivo = "O site usa o protocolo antigo HTTP sem criptografia SSL.";
            } else {
                for (let termo of gatilhosPhishing) {
                    if (linkMinusc.includes(termo)) {
                        suspeito = true;
                        motivo = `Usa palavras de urgência ou facilidades financeiras ("${termo}").`;
                        break;
                    }
                }
            }

            // Monta a resposta final com o relatório e a opção de entrada
            divResultado.className = "resultado " + (suspeito ? "perigoso" : "seguro");
            
            let htmlResultado = `
                <div class="resultado-titulo">${suspeito ? '🚨 Alerta de Risco no Endereço' : '✅ Link Analisado e Pronto'}</div>
                <div class="resultado-corpo">
                    <strong>Nome/Título do Site encontrado:</strong> ${tituloSite}<br>
                    <div class="box-descricao"><strong>Conteúdo Lido de Dentro do Link:</strong><br> "${descricaoDoSite}"</div>
                    ${suspeito ? `<br>⚠️ <strong>Aviso de Segurança:</strong> ${motivo} Tenha cuidado ao digitar dados.` : ''}
                </div>
            `;

            if (suspeito) {
                htmlResultado += `<a href="${linkFinal}" class="btn-opcao-entrada perigo" target="_blank" rel="noopener noreferrer">OPÇÃO DE ENTRADA (PROSSEGUIR COM RISCO) ↗</a>`;
                falarResultado("Alerta de risco. Analise o conteúdo encontrado na tela antes de clicar na opção de entrada.");
            } else {
                htmlResultado += `<a href="${linkFinal}" class="btn-opcao-entrada" target="_blank" rel="noopener noreferrer">OPÇÃO DE ENTRADA SEGURA ↗</a>`;
                falarResultado("Link limpo. Conteúdo lido com sucesso. Opção de entrada liberada.");
            }

            divResultado.innerHTML = htmlResultado;
        }
    </script>
</body>
</html>
