<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detetive de Links - Maratona Tech</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1d4ed8;
            --bg-global: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #e2e8f0;
            
            --safe-bg: #f0fdf4;
            --safe-text: #166534;
            --safe-border: #22c55e;
            
            --danger-bg: #fef2f2;
            --danger-text: #991b1b;
            --danger-border: #ef4444;

            --warning-bg: #fffbeb;
            --warning-text: #92400e;
            --warning-border: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .acessibilidade {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            width: 100%;
            max-width: 750px;
        }

        .btn-acessivel {
            background-color: #e2e8f0;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-acessivel:hover {
            background-color: #cbd5e1;
        }

        .btn-som {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .btn-som:hover {
            background-color: #bbf7d0;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            font-size: 20px;
            transition: font-size 0.2s ease;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.8em;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9em;
            line-height: 1.5;
        }

        .area-busca {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .area-busca label {
            font-size: 0.85em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .input-container {
            position: relative;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 20px;
            font-size: 0.9em;
            color: var(--text-main);
            background-color: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.15);
        }

        .btn-verificar {
            background-color: var(--primary);
            color: #ffffff;
            padding: 18px;
            font-size: 1em;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(30, 64, 175, 0.2);
        }

        .btn-verificar:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .resultado {
            margin-top: 32px;
            padding: 24px;
            border-radius: 12px;
            border-left: 6px solid;
            transition: all 0.3s ease;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .oculta {
            display: none;
        }

        .carregando {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border-color: var(--warning-border);
            font-weight: 600;
            text-align: center;
        }

        .seguro {
            background-color: var(--safe-bg);
            color: var(--safe-text);
            border-color: var(--safe-border);
        }

        .perigoso {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border-color: var(--danger-border);
        }

        .resultado-titulo {
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .resultado-corpo {
            font-weight: 400;
            color: #334155;
        }

        /* Estilo do Visualizador do Site */
        .janela-site {
            margin-top: 24px;
            width: 100%;
            height: 400px;
            border: 2px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background-color: #fff;
        }

        .janela-site iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="acessibilidade">
        <button type="button" class="btn-acessivel" onclick="mudarFonte(2)">A+ Ampliar Texto</button>
        <button type="button" class="btn-acessivel" onclick="mudarFonte(-2)">A- Reduzir Texto</button>
        <button type="button" class="btn-acessivel btn-som" onclick="lerTexto()">🔊 Ouvir Instruções</button>
    </div>

    <main class="container" id="container-principal">
        <header>
            <h1>Detetive de Links</h1>
            <p id="texto-instrucao">Cole o endereço do site abaixo para realizar a varredura e visualizar a página.</p>
        </header>

        <form class="area-busca" onsubmit="event.preventDefault(); verificarLink();">
            <label for="input-link">Endereço Eletrônico (URL):</label>
            <div class="input-container">
                <input type="text" id="input-link" placeholder="Ex: site-falso-promocao.com ou http://exemplo.com" autocomplete="off">
            </div>
            <button type="submit" class="btn-verificar">DISPARAR ANÁLISE E ABRIR SITE</button>
        </form>

        <div id="resultado" class="resultado oculta"></div>

        <!-- Área onde o site externo será carregado -->
        <div id="visualizador-container" class="janela-site oculta">
            <iframe id="janela-iframe" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </div>
    </main>

    <script>
        let tamanhoFonteAtual = 20;

        function mudarFonte(variacao) {
            tamanhoFonteAtual += variacao;
            if (tamanhoFonteAtual < 14) tamanhoFonteAtual = 14;
            if (tamanhoFonteAtual > 32) tamanhoFonteAtual = 32;
            
            const container = document.getElementById("container-principal");
            if (container) {
                container.style.fontSize = tamanhoFonteAtual + "px";
            }
        }

        function lerTexto() {
            const texto = "Bem-vindo ao Detetive de Links. Cole o endereço do site no campo indicado e clique no botão azul para analisar e visualizar.";
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const fala = new SpeechSynthesisUtterance(texto);
                fala.lang = 'pt-BR';
                fala.rate = 0.95; 
                window.speechSynthesis.speak(fala);
            }
        }

        function falarResultado(mensagem) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const fala = new SpeechSynthesisUtterance(mensagem);
                fala.lang = 'pt-BR';
                fala.rate = 0.95;
                window.speechSynthesis.speak(fala);
            }
        }

        function verificarLink() {
            const inputElement = document.getElementById("input-link");
            const divResultado = document.getElementById("resultado");
            const visualizadorContainer = document.getElementById("visualizador-container");
            const iframe = document.getElementById("janela-iframe");

            if (!inputElement || !divResultado || !visualizadorContainer || !iframe) return;

            let linkOriginal = inputElement.value.trim();

            if (linkOriginal === "") {
                alert("Por favor, insira uma URL válida para análise.");
                return;
            }

            // Se o link não começar com http:// ou https://, adiciona http:// automaticamente para aceitar qualquer link
            let linkFormatado = linkOriginal;
            if (!/^https?:\/\//i.test(linkFormatado)) {
                linkFormatado = "http://" + linkFormatado;
            }

            const linkMinusc = linkFormatado.toLowerCase();

            divResultado.className = "resultado carregando";
            divResultado.innerHTML = "⏳ Conectando ao link e renderizando visualização de segurança...";
            visualizadorContainer.classList.add("oculta");

            setTimeout(() => {
                divResultado.className = "resultado";
                
                const gatilhosPhishing = ["promocao", "premio", "gratis", "urgente", "banco", "atualize", "cpf", "desconto", "ganhe", "sorteio", "vaga", "pix", "futebol", "netflix"];
                let motivo = "";
                let suspeito = false;

                // Modificado para aceitar http de forma geral, mas avisar se for inseguro
                if (linkMinusc.startsWith("http://")) {
                    suspeito = true;
                    motivo = "O site utiliza o protocolo antigo HTTP (sem a criptografia segura HTTPS). Dados enviados nesta página podem ser expostos.";
                } else {
                    for (let termo of gatilhosPhishing) {
                        if (linkMinusc.includes(termo)) {
                            suspeito = true;
                            motivo = `Foi localizado o marcador de alta urgência ou benefício irreal: "${termo}".`;
                            break;
                        }
                    }
                }

                if (linkMinusc.includes("mercadolivre") && !linkMinusc.includes("mercadolivre.com.br")) {
                    suspeito = true;
                    motivo = "A URL simula a marca 'Mercado Livre', mas aponta para um servidor externo não homologado.";
                }

                if (suspeito) {
                    divResultado.classList.add("perigoso");
                    divResultado.innerHTML = `
                        <div class="resultado-titulo">🚨 Alerta de Risco / Insegurança</div>
                        <div class="resultado-corpo"><strong>Diagnóstico:</strong> ${motivo} Exibindo visualização abaixo com restrições de segurança.</div>
                    `;
                    falarResultado("Aviso de risco identificado. Veja o diagnóstico na tela.");
                } else {
                    divResultado.classList.add("seguro");
                    divResultado.innerHTML = `
                        <div class="resultado-titulo">✅ Link Analisado</div>
                        <div class="resultado-corpo"><strong>Diagnóstico:</strong> Estrutura de link aceitável encontrada. Carregando interface gráfica abaixo...</div>
                    `;
                    falarResultado("Análise concluída. Carregando interface.");
                }

                // Carrega o link dentro da janela iframe e exibe na tela
                iframe.src = linkFormatado;
                visualizadorContainer.classList.remove("oculta");

            }, 1200);
        }
    </script>
</body>
</html>
